name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Read and validate application version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version '$version' is not valid semver X.Y.Z."
          }

          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
            if ($tagVersion -ne $version) {
              throw "Release tag v$tagVersion does not match package.json version $version."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building Windows Performance Optimizer Suite v$version"

      - name: Determine whether this commit is a release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $shouldRelease = $false

          if ('${{ github.ref_type }}' -eq 'tag') {
            $shouldRelease = $true
          } elseif ('${{ github.ref }}' -eq 'refs/heads/main') {
            try {
              $previousJson = git show HEAD^:package.json | ConvertFrom-Json
              if ($previousJson.version -ne $version) {
                $shouldRelease = $true
              }
            } catch {
              Write-Host 'No previous package.json found; treating this as non-release.'
            }
          }

          if ($shouldRelease) {
            gh release view "v$version" --repo mahmoudhindam9-stack/win-Admin 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release v$version already exists; build will not publish a duplicate."
              $shouldRelease = $false
            }
          }

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "should_release=$shouldRelease"

      - name: Generate branded installer artwork
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path buildResources | Out-Null
          @'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F19"/><stop offset="1" stop-color="#14233B"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
            <rect width="1024" height="1024" rx="190" fill="url(#bg)"/><rect x="86" y="86" width="852" height="852" rx="150" fill="#0F172A" stroke="#1F3558" stroke-width="10"/>
            <path d="M512 170 L780 270 V486 C780 676 665 798 512 858 C359 798 244 676 244 486 V270 Z" fill="none" stroke="url(#accent)" stroke-width="42"/>
            <path d="M360 500 L455 595 L665 385" fill="none" stroke="#E2F3FF" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/><circle cx="512" cy="512" r="12" fill="#22D3EE"/>
          </svg>
          '@ | Set-Content -Encoding UTF8 buildResources/icon.svg
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) { choco install imagemagick -y --no-progress }
          magick buildResources/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 buildResources/icon.ico
          @'
          <svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314"><rect width="164" height="314" fill="#07101F"/><text x="82" y="150" text-anchor="middle" fill="#E2F3FF" font-family="Segoe UI,Arial" font-size="13" font-weight="700">WINDOWS PERFORMANCE</text><text x="82" y="171" text-anchor="middle" fill="#E2F3FF" font-family="Segoe UI,Arial" font-size="13" font-weight="700">OPTIMIZER</text><text x="82" y="200" text-anchor="middle" fill="#67E8F9" font-family="Segoe UI,Arial" font-size="10">Secure • Live • Professional</text></svg>
          '@ | Set-Content -Encoding UTF8 buildResources/installerSidebar.svg
          magick buildResources/installerSidebar.svg -resize 164x314! buildResources/installerSidebar.bmp

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build Windows NSIS installer and updater metadata
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify end-user update package
        shell: pwsh
        run: |
          $setups = Get-ChildItem release -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstaller' }
          if (-not $setups) { throw 'End-user Setup.exe was not produced.' }
          if (@(Get-ChildItem release -Filter '*.yml').Count -eq 0) { throw 'Updater metadata (*.yml) was not produced.' }
          if (@(Get-ChildItem release -Filter '*.blockmap').Count -eq 0) { throw 'Updater blockmap was not produced.' }
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload final end-user update package
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Performance-Optimizer-Suite-Update-v${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for current application version
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Windows Performance Optimizer Suite v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          generate_release_notes: true
