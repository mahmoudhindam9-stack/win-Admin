name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Generate branded installer artwork
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path buildResources | Out-Null

          @'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0B0F19"/>
                <stop offset="1" stop-color="#14233B"/>
              </linearGradient>
              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#22D3EE"/>
                <stop offset="1" stop-color="#2563EB"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="190" fill="url(#bg)"/>
            <rect x="86" y="86" width="852" height="852" rx="150" fill="#0F172A" stroke="#1F3558" stroke-width="10"/>
            <path d="M512 170 L780 270 V486 C780 676 665 798 512 858 C359 798 244 676 244 486 V270 Z" fill="none" stroke="url(#accent)" stroke-width="42"/>
            <path d="M360 500 L455 595 L665 385" fill="none" stroke="#E2F3FF" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="512" cy="512" r="12" fill="#22D3EE"/>
          </svg>
          '@ | Set-Content -Encoding UTF8 buildResources/icon.svg

          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }

          magick buildResources/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 buildResources/icon.ico

          @'
          <svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#07101F"/>
                <stop offset="1" stop-color="#12335B"/>
              </linearGradient>
            </defs>
            <rect width="164" height="314" fill="url(#g)"/>
            <circle cx="82" cy="72" r="38" fill="#0F172A" stroke="#22D3EE" stroke-width="5"/>
            <path d="M62 72 L76 86 L105 57" fill="none" stroke="#E2F3FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="82" y="141" text-anchor="middle" fill="#E2F3FF" font-family="Segoe UI, Arial" font-size="14" font-weight="700">WINDOWS</text>
            <text x="82" y="162" text-anchor="middle" fill="#E2F3FF" font-family="Segoe UI, Arial" font-size="14" font-weight="700">PERFORMANCE</text>
            <text x="82" y="183" text-anchor="middle" fill="#E2F3FF" font-family="Segoe UI, Arial" font-size="14" font-weight="700">OPTIMIZER</text>
            <text x="82" y="211" text-anchor="middle" fill="#67E8F9" font-family="Segoe UI, Arial" font-size="10">Secure • Live • Professional</text>
            <rect x="22" y="244" width="120" height="1" fill="#2B4C73"/>
            <text x="82" y="270" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="9">System maintenance</text>
            <text x="82" y="285" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="9">and performance tools</text>
          </svg>
          '@ | Set-Content -Encoding UTF8 buildResources/installerSidebar.svg

          magick buildResources/installerSidebar.svg -resize 164x314! buildResources/installerSidebar.bmp

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build Windows NSIS installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*.exe' | Where-Object { $_.Name -notmatch 'uninstaller' }
          if (-not $setup) { throw 'Setup.exe was not produced.' }
          $uninstaller = Get-ChildItem release -Filter '*.exe' | Where-Object { $_.Name -match 'uninstaller' }
          if (-not $uninstaller) { Write-Host 'Uninstaller is generated by NSIS at install time.' }
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Performance-Optimizer-Suite-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
